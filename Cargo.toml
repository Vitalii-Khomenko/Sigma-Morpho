[package]
name = "sigma_morpho"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["rustls-tls", "socks", "brotli", "gzip", "deflate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
url = "2"
dashmap = "6"
